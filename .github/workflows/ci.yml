name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen pkgconf

      - name: Cache Vendor (libusb + libmtp)
        uses: actions/cache@v4
        with:
          path: Vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/build-deps.sh') }}

      - name: Build app + extension (universal, ad-hoc)
        run: scripts/release.sh --adhoc

      - name: Build CLI
        run: make cli

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: PortHole-dmg
          path: build/release/*.dmg
          if-no-files-found: error
