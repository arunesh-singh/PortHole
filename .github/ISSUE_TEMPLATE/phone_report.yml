name: Phone compatibility report
description: Tell us how PortHole works with your phone
labels: [compatibility]
body:
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: MTP — browse
        - label: MTP — copy to/from phone, rename, delete
        - label: ADB over USB — everything
        - label: ADB over Wi-Fi — pair and connect
  - type: textarea
    id: notes
    attributes:
      label: Notes / problems
